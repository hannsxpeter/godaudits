<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-labelledby="t d">
  <title id="t">godaudits: eighteen domains, one verdict, no pass without evidence</title>
  <desc id="d">Banner with the godaudits wordmark, a tagline, and a progress bar of six stages whose last block is the verdict boss.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1D2A40" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101722" stop-opacity="0"/>
      <stop offset="1" stop-color="#101722" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="420" fill="#101722"/>
  <rect width="1280" height="420" fill="url(#grid)"/>
  <rect y="220" width="1280" height="200" fill="url(#fade)"/>
  <path d="M24 40V24H40M1240 24H1256V40M1256 380V396H1240M40 396H24V380" fill="none" stroke="#4FD1A1" stroke-width="4"/>
  <text x="640" y="82" text-anchor="middle" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="16" letter-spacing="5" fill="#9AA7BD">PRESS START ON A REAL CODEBASE</text>
  <text x="640" y="205" text-anchor="middle" font-family="Newsreader, Georgia, 'Times New Roman', serif" font-weight="600" font-size="128" letter-spacing="4" fill="#F2EBDD">GODAUDITS</text>
  <text x="640" y="258" text-anchor="middle" font-family="Newsreader, Georgia, 'Times New Roman', serif" font-size="30" fill="#F2EBDD">Eighteen domains. One verdict. No pass without evidence.</text>
  <g transform="translate(200 305)">
    <rect x="0" y="0" width="132" height="28" fill="#4FD1A1"/>
    <rect x="148" y="0" width="132" height="28" fill="#4FD1A1"/>
    <rect x="296" y="0" width="132" height="28" fill="#4FD1A1"/>
    <rect x="444" y="0" width="132" height="28" fill="#4FD1A1"/>
    <rect x="592" y="0" width="132" height="28" fill="#4FD1A1"/>
    <rect x="740" y="0" width="140" height="28" fill="#FF6B57"/>
    <g font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="14" letter-spacing="2" fill="#101722" text-anchor="middle">
      <text x="66" y="19">FINGERPRINT</text>
      <text x="214" y="19">JUDGE</text>
      <text x="362" y="19">REFUTE</text>
      <text x="510" y="19">SCORE</text>
      <text x="658" y="19">PLAN</text>
      <text x="810" y="19">VERDICT</text>
    </g>
  </g>
  <text x="640" y="372" text-anchor="middle" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#9AA7BD">Hashed evidence, a full check ledger, computed scores, and a repair plan another agent can run.</text>
</svg>
