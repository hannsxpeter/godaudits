apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-session-api
spec:
  replicas: 6
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: checkout-session-api
  template:
    metadata:
      labels:
        app: checkout-session-api
    spec:
      containers:
        - name: api
          image: registry.internal/checkout-session-api:1.0.0
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            periodSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-session-api
spec:
  selector:
    app: checkout-session-api
  sessionAffinity: None
  ports:
    - port: 80
      targetPort: 8080
