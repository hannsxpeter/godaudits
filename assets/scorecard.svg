<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t d">
  <title id="t">godaudits scorecard loop</title>
  <desc id="d">How an audit run works. Fingerprint maps the repo. Judge evaluates 437 checks. Refute argues against findings. Validate rejects bad state. Score computes grades. Report hands agents a repair plan.</desc>
  <style>
    .sans{font-family:"Avenir Next","Helvetica Neue",Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
  </style>
  <rect x="0.5" y="0.5" width="1199" height="419" rx="10" fill="#14110E" stroke="#2E2820"/>
  <path d="M1 44H1199V11a10 10 0 0 0-10-10H11A10 10 0 0 0 1 11Z" fill="#1C1814"/>
  <line x1="1" y1="44" x2="1199" y2="44" stroke="#2E2820"/>
  <text x="32" y="28" class="mono" font-size="13" font-weight="700" fill="#E8A54B" letter-spacing="1.5">SCORECARD LOOP</text>
  <text x="1168" y="28" class="mono" font-size="13" fill="#A09078" text-anchor="end">NO XP  REAL GRADES</text>

  <g transform="translate(36 84)">
    <rect width="176" height="280" rx="4" fill="#1C1814" stroke="#E8A54B"/>
    <text x="20" y="48" class="mono" font-size="28" font-weight="700" fill="#E8A54B">1</text>
    <text x="20" y="88" class="sans" font-size="20" font-weight="700" fill="#F5EFE4">Fingerprint</text>
    <text x="20" y="120" class="sans" font-size="13" fill="#A09078">Hash the tree.</text>
    <text x="20" y="142" class="sans" font-size="13" fill="#A09078">Detect the form.</text>
    <text x="20" y="250" class="mono" font-size="12" fill="#E8A54B">evidence</text>
  </g>
  <g transform="translate(228 84)">
    <rect width="176" height="280" rx="4" fill="#1C1814" stroke="#2E2820"/>
    <text x="20" y="48" class="mono" font-size="28" font-weight="700" fill="#E8A54B">2</text>
    <text x="20" y="88" class="sans" font-size="20" font-weight="700" fill="#F5EFE4">Judge</text>
    <text x="20" y="120" class="sans" font-size="13" fill="#A09078">437 checks across</text>
    <text x="20" y="142" class="sans" font-size="13" fill="#A09078">18 domains.</text>
    <text x="20" y="250" class="mono" font-size="12" fill="#E8A54B">skill + refs</text>
  </g>
  <g transform="translate(420 84)">
    <rect width="176" height="280" rx="4" fill="#1C1814" stroke="#2E2820"/>
    <text x="20" y="48" class="mono" font-size="28" font-weight="700" fill="#E8A54B">3</text>
    <text x="20" y="88" class="sans" font-size="20" font-weight="700" fill="#F5EFE4">Refute</text>
    <text x="20" y="120" class="sans" font-size="13" fill="#A09078">Argue against</text>
    <text x="20" y="142" class="sans" font-size="13" fill="#A09078">every finding.</text>
    <text x="20" y="250" class="mono" font-size="12" fill="#E8A54B">adversarial</text>
  </g>
  <g transform="translate(612 84)">
    <rect width="176" height="280" rx="4" fill="#1C1814" stroke="#2E2820"/>
    <text x="20" y="48" class="mono" font-size="28" font-weight="700" fill="#E8A54B">4</text>
    <text x="20" y="88" class="sans" font-size="20" font-weight="700" fill="#F5EFE4">Validate</text>
    <text x="20" y="120" class="sans" font-size="13" fill="#A09078">Reject gaps,</text>
    <text x="20" y="142" class="sans" font-size="13" fill="#A09078">stale facts, math.</text>
    <text x="20" y="250" class="mono" font-size="12" fill="#E8A54B">runtime</text>
  </g>
  <g transform="translate(804 84)">
    <rect width="176" height="280" rx="4" fill="#1C1814" stroke="#2E2820"/>
    <text x="20" y="48" class="mono" font-size="28" font-weight="700" fill="#E8A54B">5</text>
    <text x="20" y="88" class="sans" font-size="20" font-weight="700" fill="#F5EFE4">Score</text>
    <text x="20" y="120" class="sans" font-size="13" fill="#A09078">Computed grades</text>
    <text x="20" y="142" class="sans" font-size="13" fill="#A09078">from recorded facts.</text>
    <text x="20" y="250" class="mono" font-size="12" fill="#E8A54B">compiler</text>
  </g>
  <g transform="translate(996 84)">
    <rect width="168" height="280" rx="4" fill="#1C1814" stroke="#2E2820"/>
    <text x="20" y="48" class="mono" font-size="28" font-weight="700" fill="#E8A54B">6</text>
    <text x="20" y="88" class="sans" font-size="20" font-weight="700" fill="#F5EFE4">Report</text>
    <text x="20" y="120" class="sans" font-size="13" fill="#A09078">MDX repair plan</text>
    <text x="20" y="142" class="sans" font-size="13" fill="#A09078">agents can run.</text>
    <text x="20" y="250" class="mono" font-size="12" fill="#E8A54B">AUDIT.mdx</text>
  </g>
</svg>
